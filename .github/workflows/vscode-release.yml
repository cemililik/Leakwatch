name: Publish VS Code Extension

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the packaged VSIX to Visual Studio Marketplace
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: vscode-marketplace-publish
  cancel-in-progress: false

defaults:
  run:
    working-directory: vscode

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: vscode/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint, test, and package
        run: npm run lint && npm test && npm run package:vsix

      - name: Upload reviewable VSIX
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: leakwatch-vsix
          path: vscode/leakwatch-*.vsix
          if-no-files-found: error
          retention-days: 14

  publish:
    if: ${{ inputs.publish && github.ref == 'refs/heads/main' }}
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: vscode-marketplace
    permissions:
      actions: read
      contents: read
      deployments: read
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false

      - name: Fail closed unless Marketplace environment policy is protected
        env:
          GH_API_TOKEN: ${{ github.token }}
          GH_ENVIRONMENT_AUDIT_TOKEN: ${{ secrets.VSCODE_ENV_AUDIT_TOKEN }}
        run: |
          policy_file="${RUNNER_TEMP:?}/vscode-marketplace-environment.json"
          curl --fail-with-body --silent --show-error \
            --header "Accept: application/vnd.github+json" \
            --header @<(printf 'Authorization: Bearer %s\n' "${GH_API_TOKEN:?}") \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL:?}/repos/${GITHUB_REPOSITORY:?}/environments/vscode-marketplace" \
            --output "$policy_file"
          jq --exit-status '
            ([.protection_rules[]?
              | select(.type == "required_reviewers" and .prevent_self_review == true)
              | .reviewers[]?] | length) >= 1
            and .deployment_branch_policy.protected_branches == true
          ' "$policy_file" >/dev/null

          secret_metadata_file="${RUNNER_TEMP:?}/vscode-marketplace-vsce-pat.json"
          curl --fail-with-body --silent --show-error \
            --header "Accept: application/vnd.github+json" \
            --header @<(printf 'Authorization: Bearer %s\n' "${GH_ENVIRONMENT_AUDIT_TOKEN:?}") \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL:?}/repos/${GITHUB_REPOSITORY:?}/environments/vscode-marketplace/secrets/VSCE_PAT" \
            --output "$secret_metadata_file"
          jq --exit-status '.name == "VSCE_PAT"' "$secret_metadata_file" >/dev/null

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: vscode/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Download reviewed VSIX
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: leakwatch-vsix
          path: vscode/artifact

      - name: Publish reviewed VSIX
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          : "${VSCE_PAT:?missing environment-scoped VSCE_PAT}"
          mapfile -t packages < <(find artifact -type f -name 'leakwatch-*.vsix' -print)
          if [[ ${#packages[@]} -ne 1 ]]; then
            echo "expected exactly one VSIX artifact" >&2
            exit 1
          fi
          npx --no-install vsce publish --packagePath "${packages[0]}"

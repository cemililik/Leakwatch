name: Publish VS Code Extension

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the packaged VSIX to Visual Studio Marketplace
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: vscode-marketplace-publish
  cancel-in-progress: false

defaults:
  run:
    working-directory: vscode

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: vscode/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint, test, and package
        run: npm run lint && npm test && npm run package:vsix

      - name: Upload reviewable VSIX
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: leakwatch-vsix
          path: vscode/leakwatch-*.vsix
          if-no-files-found: error
          retention-days: 14

  publish:
    if: ${{ inputs.publish }}
    needs: package
    runs-on: ubuntu-latest
    environment: vscode-marketplace
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: vscode/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Download reviewed VSIX
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: leakwatch-vsix
          path: vscode/artifact

      - name: Publish reviewed VSIX
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          mapfile -t packages < <(find artifact -type f -name 'leakwatch-*.vsix' -print)
          if [[ ${#packages[@]} -ne 1 ]]; then
            echo "expected exactly one VSIX artifact" >&2
            exit 1
          fi
          npx vsce publish --packagePath "${packages[0]}" --pat "$VSCE_PAT"

name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      # Required for cosign keyless signing (.goreleaser.yml's `signs:` /
      # `docker_signs:` blocks): cosign exchanges this OIDC token for a
      # short-lived Fulcio certificate, so no long-lived signing key is ever
      # stored as a secret.
      id-token: write
    steps:
      # actions/checkout@v6.0.0
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
        with:
          fetch-depth: 0
          persist-credentials: false
      # actions/setup-go@v6.0.0
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00
        with:
          go-version: '1.25.12'
      - name: Validate release tag, metadata, and generated site
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          go run ./internal/meta/releasecheck --tag "$RELEASE_TAG"
          go test ./internal/meta ./cmd
          (
            cd tools/site-build
            go run . -strict
          )
          git diff --exit-code -- site
          test -z "$(git status --porcelain --untracked-files=all -- site)"
      # docker/setup-qemu-action@v3.2.0
      - name: Set up QEMU
        uses: docker/setup-qemu-action@49b3bc8e6bdd4a60e6116a5414239cba5943d3cf
      # docker/setup-buildx-action@v3.7.1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@c47758b77c9736f4b2ef4073d4d51994fabfe349
      # docker/login-action@v3.3.0
      - name: Log in to GHCR
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # sigstore/cosign-installer@v4.1.2 — provides the `cosign` binary that
      # .goreleaser.yml's `signs:`/`docker_signs:` blocks shell out to.
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
      # anchore/sbom-action/download-syft@v0.24.0 — provides the `syft`
      # binary that .goreleaser.yml's `sboms:` block shells out to.
      - name: Install syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610
      # goreleaser/goreleaser-action@v6.4.0
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      # Move the floating major tag (e.g. v1) to this release so consumers can
      # pin `uses: HodeTech/Leakwatch@v1` and always get the latest v1.x. Skipped
      # for pre-releases (tags containing a hyphen, e.g. v1.5.0-rc.1). Uses the
      # REST API via gh so it works with the persist-credentials: false checkout.
      - name: Update major version tag
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Only move the major tag for a proper vMAJOR.MINOR.PATCH release tag, so
          # a malformed tag (e.g. vnext.1) can never force-move an unrelated ref.
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Tag '$TAG' is not a vX.Y.Z release tag; skipping major-tag move."
            exit 0
          fi
          MAJOR="${TAG%%.*}"   # v1.5.0 -> v1
          echo "Pointing ${MAJOR} at ${SHA} (${TAG})"
          if gh api "repos/${REPO}/git/refs/tags/${MAJOR}" >/dev/null 2>&1; then
            gh api -X PATCH "repos/${REPO}/git/refs/tags/${MAJOR}" -f sha="${SHA}" -F force=true >/dev/null
          else
            gh api -X POST "repos/${REPO}/git/refs" -f ref="refs/tags/${MAJOR}" -f sha="${SHA}" >/dev/null
          fi
          echo "Major tag ${MAJOR} now points at ${TAG}."

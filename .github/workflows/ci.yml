name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.25.12']
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version: ${{ matrix.go-version }}
          cache: true
      - run: go test -race -coverprofile=coverage.out ./...
      - name: Check coverage threshold
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | tr -d '%')
          echo "Total coverage: ${COVERAGE}%"
          if [ "$(echo "$COVERAGE < 70" | bc -l)" -eq 1 ]; then
            echo "::error::Coverage ${COVERAGE}% is below 70% threshold"
            exit 1
          fi
      - name: Detector coverage floor (95%, reporting-only)
        # CLAUDE.md mandates 95% coverage for internal/detector/... packages.
        # This does not yet fail the build: as of this step's introduction a
        # few packages (heroku, snowflake, stripe) sit just below 95%, and
        # this wave is infra-only (no Go source changes). Once those packages
        # are brought up to the floor, flip the `exit 1` back on below to make
        # this a hard gate instead of a warning.
        run: |
          set -uo pipefail
          OUTPUT=$(go test -cover ./internal/detector/... 2>&1)
          echo "$OUTPUT"
          STALE=""
          while IFS= read -r line; do
            pkg=$(grep -oE 'github\.com/HodeTech/leakwatch/internal/detector[^[:space:]]*' <<<"$line" || true)
            [ -z "$pkg" ] && continue
            pct=$(grep -oE '[0-9]+\.[0-9]+% of statements' <<<"$line" | grep -oE '^[0-9]+\.[0-9]+' || true)
            [ -z "$pct" ] && continue
            base=$(basename "$pkg")
            # testutil is a test-helper package, not a detector; it carries no
            # coverage requirement of its own.
            [ "$base" = "testutil" ] && continue
            if awk -v p="$pct" 'BEGIN{exit !(p<95)}'; then
              STALE="${STALE}  - ${pkg}: ${pct}%\n"
            fi
          done <<<"$OUTPUT"
          if [ -n "$STALE" ]; then
            echo "::warning::internal/detector packages below the CLAUDE.md-mandated 95% coverage floor (reporting-only for now):"
            printf '%b' "$STALE"
            echo "TODO: bring the packages above back to >=95% coverage, then make this step fail the build (see the comment on this step)."
          else
            echo "All internal/detector packages meet the 95% coverage floor — safe to turn this into a hard gate."
          fi
      - run: go build ./...
      - name: Cross-compile smoke test (windows/amd64)
        # Catches Windows build breaks on every push/PR instead of only at
        # release time, when .goreleaser.yml actually builds windows/amd64
        # and windows/arm64 binaries.
        run: GOOS=windows GOARCH=amd64 go build ./...
        env:
          CGO_ENABLED: '0'

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version: '1.25.12'
      - run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.11.4
      - run: golangci-lint run ./... --config .golangci.yml

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version: '1.25.12'
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
      - name: Run govulncheck
        run: govulncheck ./...

  site-sync:
    name: site-build output sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version: '1.25.12'
          cache: true
          cache-dependency-path: tools/site-build/go.sum
      - name: Regenerate site/js from tools/site-build
        working-directory: tools/site-build
        run: go run . -strict
      - name: Fail if the committed site/js has drifted from the generator
        run: |
          if ! git diff --exit-code -- site/js; then
            echo "::error::site/js is stale. Run 'cd tools/site-build && go run . -strict' from the repo root and commit the regenerated files under site/js/."
            exit 1
          fi
